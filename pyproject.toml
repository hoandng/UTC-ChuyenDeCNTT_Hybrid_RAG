[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utc-hybridrag"
version = "0.1.0"
description = "Trợ lý hỏi đáp hai giáo trình bằng BM25, FAISS và RRF"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2", "sentence-transformers>=3,<6", "faiss-cpu>=1.8,<2",
  "rank-bm25>=0.2.2,<0.3", "streamlit>=1.40,<2", "pydantic>=2.7,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "numpy>=1.26,<3", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
